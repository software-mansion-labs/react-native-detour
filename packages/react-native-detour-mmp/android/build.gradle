plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

def packageVersion = new groovy.json.JsonSlurper().parse(file('../package.json')).version

group = 'com.swmansion.detour'
version = packageVersion

android {
  namespace "com.swmansion.detour.attribution"
  defaultConfig {
    versionCode 1
    versionName packageVersion
  }
}

dependencies {
  // Added by the app (the config plugin's advertisingId option): the library brings the AD_ID
  // permission, so it is not forced on every app.
  compileOnly "com.google.android.gms:play-services-ads-identifier:18.1.0"
  compileOnly "com.google.android.gms:play-services-appset:16.1.0"
}
